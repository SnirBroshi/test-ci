name: test

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - converted_to_draft
      - ready_for_review

permissions:
  pull-requests: write
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'github.event.action:' "${{ github.event.action }}"
      - run: echo 'github.event.label.name:' "${{ github.event.label.name }}"
      - run: echo 'github.event.pull_request.draft:' "${{ github.event.pull_request.draft }}"
      - run: echo 'github.event.pull_request.state:' "${{ github.event.pull_request.state }}"
      - run: echo 'github:' "${{ github }}"
      - run: env
      - if: github.event.pull_request.draft || (github.event.pull_request.draft && github.event.pull_request.draft)
        run: echo is draft
      - if: false || (!github.event.pull_request.draft && !github.event.pull_request.draft)
        run: echo not a draft
      - if: github.event.pull_request.state == 'open'
        run: echo is open
      - if: github.event.pull_request.state == 'closed'
        run: echo is closed
      - if: github.event.action == 'labeled' && github.event.label.name == 'bug'
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --add-label accessibility
      - if: github.event.action == 'unlabeled' && github.event.label.name == 'bug'
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --remove-label accessibility
