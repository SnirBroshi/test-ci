name: test

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - converted_to_draft
      - ready_for_review

permissions:
  pull-requests: write

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: foo1
        run: echo 'github.event.action:' "${{ github.event.action }}"
      - run: echo 'github.event.label.name:' "${{ github.event.label.name }}"
      - run: echo 'github.event.pull_request.draft:' "${{ github.event.pull_request.draft }}"
      - run: env
      - name: foo2
        if: github.event.action == 'converted_to_draft'
        run: gh pr edit --add-label bug
